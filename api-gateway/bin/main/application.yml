server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: payment-service
          uri: http://localhost:8082
          predicates:
            - Path=/payment-service/**
          filters:
            - StripPrefix=1
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth-service/**
          filters:
            - StripPrefix=1
        - id: card-service
          uri: http://localhost:8082
          predicates:
            - Path=/card-service/**
          filters:
            - StripPrefix=1
        - id: fraud-service
          uri: http://localhost:8083
          predicates:
            - Path=/fraud-service/**
          filters:
            - StripPrefix=1
        - id: notification-service
          uri: http://localhost:8086
          predicates:
            - Path=/notification-service/**
          filters:
            - StripPrefix=1
        - id: audit-service
          uri: http://localhost:8087
          predicates:
            - Path=/audit-service/**
          filters:
            - StripPrefix=1
        - id: loan-service
          uri: http://localhost:8083
          predicates:
            - Path=/loan-service/**
          filters:
            - StripPrefix=1

# Dynamic routes configuration with load balancing and security
gateway:
  routes:
    - id: payment-service-lb
      serviceName: payment-service
      path: /payment-service/**
      targets:
        - http://localhost:8081
        - http://localhost:8082
      loadBalancingStrategy: ROUND_ROBIN
      enabled: true
      retries: 3
      timeoutMs: 30000

    - id: auth-service-lb
      serviceName: auth-service
      path: /auth-service/**
      targets:
        - http://localhost:8081
      loadBalancingStrategy: ROUND_ROBIN
      enabled: true
      retries: 3
      timeoutMs: 30000

    - id: card-service-lb
      serviceName: card-service
      path: /card-service/**
      targets:
        - http://localhost:8082
      loadBalancingStrategy: ROUND_ROBIN
      enabled: true
      retries: 3
      timeoutMs: 30000

    - id: fraud-service-lb
      serviceName: fraud-service
      path: /fraud-service/**
      targets:
        - http://localhost:8083
      loadBalancingStrategy: ROUND_ROBIN
      enabled: true
      retries: 3
      timeoutMs: 30000

  # Eureka service discovery configuration
  eureka:
    enabled: true
    refresh-interval: 30000 # 30 seconds
    service-mappings:
      - service-id: payment-service
        route-id: payment-service-lb
        disable-on-not-found: false
      - service-id: auth-service
        route-id: auth-service-lb
        disable-on-not-found: false
      - service-id: card-service
        route-id: card-service-lb
        disable-on-not-found: false
      - service-id: fraud-service
        route-id: fraud-service-lb
        disable-on-not-found: false

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    hostname: localhost
    preferIpAddress: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

  security:
    jwt:
      secret: mySecretKeyForJWTTokenValidationAndCreationPurposes
      expiration: 86400000 # 24 hours in milliseconds
      enabled: true

    # Public paths that do not require authentication
    public-paths:
      - /api/security/login
      - /api/security/validate
      - /api/security/health
      - /api/routes/health
      - /api/eureka/status
      - /actuator/health

    # Per-route security rules (path patterns to required roles)
    route-security:
      - path: /payment-service/
        roles:
          - PAYMENT_USER
          - ADMIN

      - path: /card-service/
        roles:
          - CARD_USER
          - ADMIN

      - path: /auth-service/
        roles:
          - AUTH_USER
          - ADMIN

      - path: /fraud-service/
        roles:
          - FRAUD_ANALYST
          - ADMIN

      - path: /api/routes
        roles:
          - ADMIN
          - GATEWAY_ADMIN

      - path: /api/eureka
        roles:
          - ADMIN
          - GATEWAY_ADMIN

      - path: /api/security
        roles:
          - ADMIN

    # API Key configuration (optional, disabled by default)
    api-key:
      enabled: false
      header-name: X-API-Key
