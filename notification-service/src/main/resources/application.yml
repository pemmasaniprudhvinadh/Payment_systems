server:
  port: 8086

spring:
  application:
    name: notification-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.type.mapping: "paymentRequested:com.example.common.events.PaymentEvents$PaymentRequested,fraudCheckCompleted:com.example.common.events.PaymentEvents$FraudCheckCompleted,paymentAuthorized:com.example.common.events.PaymentEvents$PaymentAuthorized,paymentSettled:com.example.common.events.PaymentEvents$PaymentSettled"

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 2s

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1000

  timelimiter:
    configs:
      default:
        cancelRunningFuture: true
        timeoutDuration: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
